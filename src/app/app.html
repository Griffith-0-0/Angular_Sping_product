<div class="container-fluid p-3">
  <header class="mb-4">
    <h1 class="display-5 fw-bold">Hello, {{ title }}</h1>
  </header>

  <nav aria-label="Main navigation" class="mb-4">
    <div class="btn-group" role="group">
      <a routerLink="/home"
         routerLinkActive="active"
         [routerLinkActiveOptions]="{exact: true}"
         class="btn btn-outline-primary d-flex align-items-center"
         ariaCurrentWhenActive="page">
        <i class="bi bi-house-door me-2" aria-hidden="true"></i>
        Home
      </a>
      <a routerLink="/products"
         routerLinkActive="active"
         class="btn btn-outline-primary d-flex align-items-center"
         ariaCurrentWhenActive="page">
        <i class="bi bi-box-seam me-2" aria-hidden="true"></i>
        Products
      </a>
    </div>
  </nav>

  <main class="border rounded p-4 bg-light">
    <router-outlet></router-outlet>
  </main>
</div>
