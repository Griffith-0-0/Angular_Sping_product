<header class="container pt-4 pb-2">
  <h1>Hello, {{title}}</h1>
</header>

<div class="container pb-4">
  <nav class="mb-4" aria-label="Main navigation">
    <div class="btn-group shadow-sm" role="group">
      <a routerLink="/home"
         routerLinkActive
         #rlaHome="routerLinkActive"
         [class.btn-primary]="rlaHome.isActive"
         [class.btn-outline-primary]="!rlaHome.isActive"
         ariaCurrentWhenActive="page"
         class="btn">
        <i class="bi bi-house-door me-1" aria-hidden="true"></i>
        Home
      </a>
      <a routerLink="/products"
         routerLinkActive
         #rlaProducts="routerLinkActive"
         [class.btn-primary]="rlaProducts.isActive"
         [class.btn-outline-primary]="!rlaProducts.isActive"
         ariaCurrentWhenActive="page"
         class="btn">
        <i class="bi bi-box-seam me-1" aria-hidden="true"></i>
        Products
      </a>
    </div>
  </nav>

  <main id="main-content" tabindex="-1">
    <router-outlet></router-outlet>
  </main>
</div>
