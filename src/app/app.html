<header class="p-3 border-bottom mb-3">
  <h1>Hello, {{title}}</h1>
  <nav class="mt-3" role="group" aria-label="Main Navigation">
    <div class="btn-group shadow-sm">
      <a routerLink="/home"
         routerLinkActive="active"
         #homeLink="routerLinkActive"
         [routerLinkActiveOptions]="{exact: true}"
         [class.btn-primary]="homeLink.isActive"
         [class.btn-outline-primary]="!homeLink.isActive"
         [attr.aria-current]="homeLink.isActive ? 'page' : null"
         class="btn d-inline-flex align-items-center">
        <i class="bi bi-house-door me-1" aria-hidden="true"></i>
        Home
      </a>
      <a routerLink="/products"
         routerLinkActive="active"
         #productsLink="routerLinkActive"
         [class.btn-primary]="productsLink.isActive"
         [class.btn-outline-primary]="!productsLink.isActive"
         [attr.aria-current]="productsLink.isActive ? 'page' : null"
         class="btn d-inline-flex align-items-center">
        <i class="bi bi-box-seam me-1" aria-hidden="true"></i>
        Products
      </a>
    </div>
  </nav>
</header>

<main class="p-3">
  <router-outlet></router-outlet>
</main>
