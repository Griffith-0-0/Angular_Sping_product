<div class="container mt-4">
  <header class="mb-4">
    <h1 class="display-5 fw-bold">{{ title }}</h1>
  </header>

  <nav class="mb-4" aria-label="Main Navigation">
    <div class="btn-group shadow-sm" role="group">
      <a routerLink="/home"
         routerLinkActive="active"
         [routerLinkActiveOptions]="{exact: true}"
         ariaCurrentWhenActive="page"
         class="btn btn-outline-primary d-inline-flex align-items-center"
         aria-label="Home page">
        <i class="bi bi-house-door me-1" aria-hidden="true"></i>
        <span>Home</span>
      </a>
      <a routerLink="/products"
         routerLinkActive="active"
         ariaCurrentWhenActive="page"
         class="btn btn-outline-primary d-inline-flex align-items-center"
         aria-label="Products page">
        <i class="bi bi-box-seam me-1" aria-hidden="true"></i>
        <span>Products</span>
      </a>
    </div>
  </nav>

  <main class="border rounded p-4 bg-light shadow-sm">
    <router-outlet></router-outlet>
  </main>
</div>
