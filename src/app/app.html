<div class="container py-3">
  <header>
    <h1>Hello, {{title}}</h1>
  </header>
  <nav class="mb-3" aria-label="Main navigation">
    <a routerLink="/home"
       routerLinkActive="btn-primary"
       [routerLinkActiveOptions]="{exact: true}"
       [class.btn-outline-primary]="!rlaHome.isActive"
       #rlaHome="routerLinkActive"
       ariaCurrentWhenActive="page"
       class="btn">Home</a>
    <a routerLink="/products"
       routerLinkActive="btn-primary"
       [routerLinkActiveOptions]="{exact: true}"
       [class.btn-outline-primary]="!rlaProducts.isActive"
       #rlaProducts="routerLinkActive"
       ariaCurrentWhenActive="page"
       class="ms-1 btn">Products</a>
  </nav>
  <main>
    <router-outlet></router-outlet>
  </main>
</div>
