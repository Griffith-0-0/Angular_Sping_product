<div class="container py-4">
  <header class="mb-4">
    <h1 class="mb-3">Hello, {{ title }}</h1>
    <nav aria-label="Main navigation">
      <div class="btn-group shadow-sm">
        <a routerLink="/home"
           routerLinkActive="active"
           #homeActive="routerLinkActive"
           class="btn"
           [class.btn-primary]="homeActive.isActive"
           [class.btn-outline-primary]="!homeActive.isActive"
           [attr.aria-current]="homeActive.isActive ? 'page' : null">
          Home
        </a>
        <a routerLink="/products"
           routerLinkActive="active"
           #productsActive="routerLinkActive"
           class="btn"
           [class.btn-primary]="productsActive.isActive"
           [class.btn-outline-primary]="!productsActive.isActive"
           [attr.aria-current]="productsActive.isActive ? 'page' : null">
          Products
        </a>
      </div>
    </nav>
  </header>

  <main id="main">
    <router-outlet></router-outlet>
  </main>
</div>
