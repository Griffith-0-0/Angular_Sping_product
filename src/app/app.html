<div class="container py-4">
  <nav aria-label="Main navigation" class="mb-3">
    <div class="btn-group shadow-sm" role="group">
      <a
        routerLink="/home"
        routerLinkActive
        #rlaHome="routerLinkActive"
        class="btn btn-outline-primary"
        [class.active]="rlaHome.isActive"
        [attr.aria-current]="rlaHome.isActive ? 'page' : null">
        Home
      </a>
      <a
        routerLink="/products"
        routerLinkActive
        #rlaProducts="routerLinkActive"
        class="btn btn-outline-primary"
        [class.active]="rlaProducts.isActive"
        [attr.aria-current]="rlaProducts.isActive ? 'page' : null">
        Products
      </a>
    </div>
  </nav>
  <main>
    <router-outlet></router-outlet>
  </main>
</div>
