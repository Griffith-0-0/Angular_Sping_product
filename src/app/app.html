<div class="p-3">
  <nav aria-label="Main navigation">
    <div class="btn-group shadow-sm">
      <a
        routerLink="/home"
        routerLinkActive
        #homeLink="routerLinkActive"
        class="btn"
        [class.btn-primary]="homeLink.isActive"
        [class.btn-outline-primary]="!homeLink.isActive"
        [attr.aria-current]="homeLink.isActive ? 'page' : null"
      >Home</a>
      <a
        routerLink="/products"
        routerLinkActive
        #prodLink="routerLinkActive"
        class="btn"
        [class.btn-primary]="prodLink.isActive"
        [class.btn-outline-primary]="!prodLink.isActive"
        [attr.aria-current]="prodLink.isActive ? 'page' : null"
      >Products</a>
    </div>
  </nav>
  <router-outlet></router-outlet>
</div>
