<div class="container py-4">
  <nav class="mb-4" aria-label="Main navigation">
    <div class="btn-group shadow-sm">
      <a routerLink="/home"
         routerLinkActive="btn-primary"
         [routerLinkActiveOptions]="{exact: true}"
         #rlaHome="routerLinkActive"
         [class.btn-outline-primary]="!rlaHome.isActive"
         [attr.aria-current]="rlaHome.isActive ? 'page' : null"
         class="btn">Home</a>
      <a routerLink="/products"
         routerLinkActive="btn-primary"
         #rlaProducts="routerLinkActive"
         [class.btn-outline-primary]="!rlaProducts.isActive"
         [attr.aria-current]="rlaProducts.isActive ? 'page' : null"
         class="btn">Products</a>
    </div>
  </nav>
  <main id="main">
    <router-outlet></router-outlet>
  </main>
</div>
