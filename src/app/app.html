<!-- Skip to main content link for screen readers and keyboard navigation -->
<a href="#main" class="visually-hidden-focusable btn btn-primary m-2">Skip to Main Content</a>

<div class="container py-4">
  <header class="mb-4">
    <h1 class="h3 text-primary mb-3">tpAng1 Application</h1>
    <nav aria-label="Main navigation">
      <div class="btn-group shadow-sm">
        <a routerLink="/home"
           routerLinkActive
           #homeLink="routerLinkActive"
           [class.btn-primary]="homeLink.isActive"
           [class.btn-outline-primary]="!homeLink.isActive"
           [attr.aria-current]="homeLink.isActive ? 'page' : null"
           class="btn">
           Home
        </a>
        <a routerLink="/products"
           routerLinkActive
           #productsLink="routerLinkActive"
           [class.btn-primary]="productsLink.isActive"
           [class.btn-outline-primary]="!productsLink.isActive"
           [attr.aria-current]="productsLink.isActive ? 'page' : null"
           class="btn">
           Products
        </a>
      </div>
    </nav>
  </header>

  <main id="main" tabindex="-1" class="focus-ring py-2">
    <router-outlet></router-outlet>
  </main>
</div>
