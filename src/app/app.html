<div class="container py-4">
  <nav aria-label="Main navigation" class="mb-4">
    <div class="btn-group shadow-sm">
      <a
        routerLink="/home"
        routerLinkActive
        #homeL="routerLinkActive"
        [class.btn-primary]="homeL.isActive"
        [class.btn-outline-primary]="!homeL.isActive"
        [attr.aria-current]="homeL.isActive ? 'page' : null"
        class="btn"
      >
        Home
      </a>
      <a
        routerLink="/products"
        routerLinkActive
        #productsL="routerLinkActive"
        [class.btn-primary]="productsL.isActive"
        [class.btn-outline-primary]="!productsL.isActive"
        [attr.aria-current]="productsL.isActive ? 'page' : null"
        class="btn"
      >
        Products
      </a>
    </div>
  </nav>
  <main>
    <router-outlet></router-outlet>
  </main>
</div>
