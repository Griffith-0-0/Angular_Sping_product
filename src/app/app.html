<a href="#main" class="visually-hidden-focusable position-absolute p-2 m-2 btn btn-secondary">
  Skip to main content
</a>
<div class="container py-4">
  <header class="mb-4">
    <nav aria-label="Main navigation">
      <div class="btn-group shadow-sm">
        <a
          routerLink="/home"
          routerLinkActive="btn-primary"
          #homeRla="routerLinkActive"
          [class.btn-outline-primary]="!homeRla.isActive"
          [attr.aria-current]="homeRla.isActive ? 'page' : null"
          class="btn"
        >
          Home
        </a>
        <a
          routerLink="/products"
          routerLinkActive="btn-primary"
          #prodRla="routerLinkActive"
          [class.btn-outline-primary]="!prodRla.isActive"
          [attr.aria-current]="prodRla.isActive ? 'page' : null"
          class="btn"
        >
          Products
        </a>
      </div>
    </nav>
  </header>
  <main id="main" tabindex="-1" class="fade-in">
    <router-outlet></router-outlet>
  </main>
</div>
