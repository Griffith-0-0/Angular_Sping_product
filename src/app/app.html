<!-- Skip to main content link for screen reader and keyboard accessibility -->
<a class="visually-hidden-focusable btn btn-primary m-2" href="#main">
  Skip to Main Content
</a>

<div class="container py-4">
  <header class="mb-4">
    <h1 class="h3 mb-3 text-primary d-flex align-items-center">
      <i class="bi bi-palette me-2" aria-hidden="true"></i>
      <span>tpAng1 Application</span>
    </h1>
  </header>

  <nav aria-label="Main navigation" class="mb-4">
    <div class="btn-group shadow-sm" role="group">
      <a routerLink="/home"
         routerLinkActive="active"
         #homeLink="routerLinkActive"
         [class.btn-primary]="homeLink.isActive"
         [class.btn-outline-primary]="!homeLink.isActive"
         [attr.aria-current]="homeLink.isActive ? 'page' : null"
         class="btn">
        <i class="bi bi-house-door me-1" aria-hidden="true"></i>
        Home
      </a>
      <a routerLink="/products"
         routerLinkActive="active"
         #productsLink="routerLinkActive"
         [class.btn-primary]="productsLink.isActive"
         [class.btn-outline-primary]="!productsLink.isActive"
         [attr.aria-current]="productsLink.isActive ? 'page' : null"
         class="btn">
        <i class="bi bi-box-seam me-1" aria-hidden="true"></i>
        Products
      </a>
    </div>
  </nav>

  <main id="main" tabindex="-1" class="p-3 border rounded bg-light fade-in">
    <router-outlet></router-outlet>
  </main>
</div>
