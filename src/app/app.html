<div class="container py-4">
  <nav aria-label="Main navigation">
    <div class="btn-group shadow-sm">
      <a
        routerLink="/home"
        routerLinkActive
        #homeRla="routerLinkActive"
        class="btn"
        [class.btn-primary]="homeRla.isActive"
        [class.btn-outline-primary]="!homeRla.isActive"
        [attr.aria-current]="homeRla.isActive ? 'page' : null"
      >
        Home
      </a>
      <a
        routerLink="/products"
        routerLinkActive
        #prodRla="routerLinkActive"
        class="btn"
        [class.btn-primary]="prodRla.isActive"
        [class.btn-outline-primary]="!prodRla.isActive"
        [attr.aria-current]="prodRla.isActive ? 'page' : null"
      >
        Products
      </a>
    </div>
  </nav>
  <main class="mt-3">
    <router-outlet></router-outlet>
  </main>
</div>
