<a class="visually-hidden-focusable" href="#main">Skip to main content</a>

<div class="container py-4">
  <header class="mb-4">
    <h1>Hello, {{title}}</h1>
    <nav aria-label="Main navigation">
      <div class="btn-group shadow-sm">
        <a routerLink="/home"
           routerLinkActive
           #rlaHome="routerLinkActive"
           [routerLinkActiveOptions]="{exact: true}"
           [class.btn-primary]="rlaHome.isActive"
           [class.btn-outline-primary]="!rlaHome.isActive"
           ariaCurrentWhenActive="page"
           class="btn">
          <i class="bi bi-house-door me-1" aria-hidden="true"></i>
          Home
        </a>
        <a routerLink="/products"
           routerLinkActive
           #rlaProducts="routerLinkActive"
           [routerLinkActiveOptions]="{exact: true}"
           [class.btn-primary]="rlaProducts.isActive"
           [class.btn-outline-primary]="!rlaProducts.isActive"
           ariaCurrentWhenActive="page"
           class="btn">
          <i class="bi bi-box-seam me-1" aria-hidden="true"></i>
          Products
        </a>
      </div>
    </nav>
  </header>

  <main id="main" tabindex="-1">
    <router-outlet></router-outlet>
  </main>
</div>
