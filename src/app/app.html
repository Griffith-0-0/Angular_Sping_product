<div class="p-3">
  <header>
    <h1>Hello, {{title}}</h1>
  </header>

  <nav aria-label="Main navigation" class="mb-3">
    <div class="btn-group shadow-sm" role="group">
      <a routerLink="/home"
         routerLinkActive="btn-primary"
         #homeActive="routerLinkActive"
         [class.btn-outline-primary]="!homeActive.isActive"
         [attr.aria-current]="homeActive.isActive ? 'page' : null"
         class="btn">
        <i class="bi bi-house-door me-1" aria-hidden="true"></i> Home
      </a>
      <a routerLink="/products"
         routerLinkActive="btn-primary"
         #prodActive="routerLinkActive"
         [class.btn-outline-primary]="!prodActive.isActive"
         [attr.aria-current]="prodActive.isActive ? 'page' : null"
         class="btn">
        <i class="bi bi-box-seam me-1" aria-hidden="true"></i> Products
      </a>
    </div>
  </nav>

  <main>
    <router-outlet></router-outlet>
  </main>
</div>
