<div class="container py-4">
  <a href="#main" class="visually-hidden-focusable mb-3 d-inline-block">Skip to main content</a>
  <header class="mb-4">
    <nav aria-label="Main navigation">
      <div class="btn-group shadow-sm" role="group">
        <a
          routerLink="/home"
          routerLinkActive
          #homeLink="routerLinkActive"
          class="btn"
          [class.btn-primary]="homeLink.isActive"
          [class.btn-outline-primary]="!homeLink.isActive"
          [attr.aria-current]="homeLink.isActive ? 'page' : null"
        >Home</a>
        <a
          routerLink="/products"
          routerLinkActive
          #prodLink="routerLinkActive"
          class="btn"
          [class.btn-primary]="prodLink.isActive"
          [class.btn-outline-primary]="!prodLink.isActive"
          [attr.aria-current]="prodLink.isActive ? 'page' : null"
        >Products</a>
      </div>
    </nav>
  </header>
  <main id="main" tabindex="-1">
    <router-outlet></router-outlet>
  </main>
</div>
