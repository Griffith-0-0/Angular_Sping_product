<div class="container mt-4">
  <header class="mb-4">
    <h1 class="display-5 fw-bold">Hello, {{ title }}</h1>
  </header>

  <nav aria-label="Main Navigation" class="mb-4">
    <div class="btn-group shadow-sm" role="group">
      <a routerLink="/home"
         routerLinkActive="active"
         [routerLinkActiveOptions]="{exact: true}"
         ariaCurrentWhenActive="page"
         class="btn btn-outline-primary d-inline-flex align-items-center">
        <i class="bi bi-house-door me-1" aria-hidden="true"></i>
        Home
      </a>
      <a routerLink="/products"
         routerLinkActive="active"
         ariaCurrentWhenActive="page"
         class="btn btn-outline-primary d-inline-flex align-items-center">
        <i class="bi bi-box-seam me-1" aria-hidden="true"></i>
        Products
      </a>
    </div>
  </nav>

  <main class="border rounded p-4 bg-light">
    <router-outlet></router-outlet>
  </main>
</div>
