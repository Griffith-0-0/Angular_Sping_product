<a href="#main" class="visually-hidden visually-hidden-focusable btn btn-primary m-2">Skip to main content</a>
<div class="container py-4">
  <header class="mb-4">
    <h1>Hello, {{ title }}</h1>
    <nav aria-label="Main navigation">
      <div class="btn-group shadow-sm">
        <a
          routerLink="/home"
          routerLinkActive="btn-primary"
          #homeRla="routerLinkActive"
          [class.btn-outline-primary]="!homeRla.isActive"
          [attr.aria-current]="homeRla.isActive ? 'page' : null"
          class="btn"
        >Home</a>
        <a
          routerLink="/products"
          routerLinkActive="btn-primary"
          #productsRla="routerLinkActive"
          [class.btn-outline-primary]="!productsRla.isActive"
          [attr.aria-current]="productsRla.isActive ? 'page' : null"
          class="btn"
        >Products</a>
      </div>
    </nav>
  </header>
  <main id="main" tabindex="-1">
    <router-outlet></router-outlet>
  </main>
</div>
