<a class="visually-hidden-focusable" href="#main">Skip to main content</a>
<div class="container py-4">
  <header class="mb-4"><h1 class="mb-3">Hello, {{title}}</h1></header>
  <nav class="mb-4" aria-label="Main navigation">
    <div class="btn-group shadow-sm" role="group">
      <a routerLink="/home" routerLinkActive #h="routerLinkActive" [class.btn-primary]="h.isActive" [class.btn-outline-primary]="!h.isActive" [attr.aria-current]="h.isActive ? 'page' : null" class="btn d-inline-flex align-items-center">
        <i class="bi bi-house-door me-2" aria-hidden="true"></i> Home
      </a>
      <a routerLink="/products" routerLinkActive #p="routerLinkActive" [class.btn-primary]="p.isActive" [class.btn-outline-primary]="!p.isActive" [attr.aria-current]="p.isActive ? 'page' : null" class="btn d-inline-flex align-items-center">
        <i class="bi bi-box-seam me-2" aria-hidden="true"></i> Products
      </a>
    </div>
  </nav>
  <main id="main" tabindex="-1" class="fade-in"><router-outlet></router-outlet></main>
</div>
