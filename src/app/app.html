<div class="container mt-4 mb-4">
  <nav aria-label="Main Navigation">
    <div class="btn-group shadow-sm" role="group">
      <a routerLink="/home"
         routerLinkActive="active"
         [routerLinkActiveOptions]="{exact: true}"
         aria-label="Home page"
         ariaCurrentWhenActive="page"
         class="btn btn-outline-primary px-4 d-flex align-items-center">
        <i class="bi bi-house-door me-2" aria-hidden="true"></i>
        <span>Home</span>
      </a>
      <a routerLink="/products"
         routerLinkActive="active"
         aria-label="Products page"
         ariaCurrentWhenActive="page"
         class="btn btn-outline-primary px-4 d-flex align-items-center">
        <i class="bi bi-box-seam me-2" aria-hidden="true"></i>
        <span>Products</span>
      </a>
    </div>
  </nav>

  <main class="mt-4 p-4 border rounded bg-light min-vh-50">
    <router-outlet></router-outlet>
  </main>
</div>
