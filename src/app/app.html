<div class="p-3">
  <nav aria-label="Main navigation">
    <div class="btn-group shadow-sm" role="group" aria-label="Navigation links">
      <a
        routerLink="/home"
        routerLinkActive
        #rlaHome="routerLinkActive"
        class="btn"
        [class.btn-primary]="rlaHome.isActive"
        [class.btn-outline-primary]="!rlaHome.isActive"
        [attr.aria-current]="rlaHome.isActive ? 'page' : null"
      >
        Home
      </a>
      <a
        routerLink="/products"
        routerLinkActive
        #rlaProducts="routerLinkActive"
        class="btn"
        [class.btn-primary]="rlaProducts.isActive"
        [class.btn-outline-primary]="!rlaProducts.isActive"
        [attr.aria-current]="rlaProducts.isActive ? 'page' : null"
      >
        Products
      </a>
    </div>
  </nav>
  <main class="mt-3">
    <router-outlet></router-outlet>
  </main>
</div>
