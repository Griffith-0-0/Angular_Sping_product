<a class="visually-hidden-focusable" href="#main">Skip to main content</a>

<div class="container py-4">
  <header class="mb-4">
    <h1 class="h3">Hello, {{title}}</h1>
    <nav aria-label="Main navigation">
      <div class="btn-group shadow-sm">
        <a routerLink="/home"
           routerLinkActive="btn-primary"
           [routerLinkActiveOptions]="{exact: true}"
           [class.btn-outline-primary]="!homeLink.isActive"
           ariaCurrentWhenActive="page"
           #homeLink="routerLinkActive"
           class="btn">
           <i class="bi bi-house-door me-1" aria-hidden="true"></i>Home
        </a>
        <a routerLink="/products"
           routerLinkActive="btn-primary"
           [routerLinkActiveOptions]="{exact: true}"
           [class.btn-outline-primary]="!productsLink.isActive"
           ariaCurrentWhenActive="page"
           #productsLink="routerLinkActive"
           class="btn">
           <i class="bi bi-box-seam me-1" aria-hidden="true"></i>Products
        </a>
      </div>
    </nav>
  </header>

  <main id="main" tabindex="-1" class="fade-in">
    <router-outlet></router-outlet>
  </main>
</div>
