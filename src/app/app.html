<div class="container py-4">
  <header class="mb-4">
    <h1 class="display-5 fw-bold">tpAng1</h1>
  </header>

  <nav class="mb-4" aria-label="Main navigation">
    <div class="btn-group shadow-sm" role="group">
      <a routerLink="/home"
         routerLinkActive="btn-primary"
         [routerLinkActiveOptions]="{exact: true}"
         #homeLink="routerLinkActive"
         [class.btn-outline-primary]="!homeLink.isActive"
         class="btn d-inline-flex align-items-center gap-2">
        <i class="bi bi-house-door" aria-hidden="true"></i>
        <span>Home</span>
      </a>
      <a routerLink="/products"
         routerLinkActive="btn-primary"
         #productsLink="routerLinkActive"
         [class.btn-outline-primary]="!productsLink.isActive"
         class="btn d-inline-flex align-items-center gap-2">
        <i class="bi bi-box-seam" aria-hidden="true"></i>
        <span>Products</span>
      </a>
    </div>
  </nav>

  <main>
    <router-outlet></router-outlet>
  </main>
</div>
